<!DOCTYPE html>
<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Time Tracker</title>
  </head>
  <body>
    <div class="navbars">
      <div class="sidebar">
        <div class="navitem">
          <a href="project.html" class="a">
            <div class="nav">
              <span> <img src="/sources/images/file-text.svg" alt="" /> </span>
            </div>
            <div class="linkname">
              <span>Project</span>
            </div>
          </a>
        </div>

        <div class="navitem">
          <a href="" class="active a">
            <div class="nav">
              <span> <img src="/sources/images/stopwatch.svg" alt="" /> </span>
            </div>
            <div class="linkname">
              <span>Time Tracker</span>
            </div>
          </a>
        </div>

        <div class="navitem">
          <a href="dashboard.html" class="a">
            <div class="nav">
              <span> <img src="/sources/images/grid.svg" alt="" /> </span>
            </div>
            <div class="linkname">
              <span>Dashboard</span>
            </div>
          </a>
        </div>

        <div class="navitem">
          <a href="report.html" class="a">
            <div class="nav">
              <span>
                <img src="/sources/images/graph-up-arrow.svg" alt="" />
              </span>
            </div>
            <div class="linkname">
              <span>Report</span>
            </div>
          </a>
        </div>

        <div class="navitem">
          <a href="team.html" class="a">
            <div class="nav">
              <span> <img src="/sources/images/people.svg" alt="" /> </span>
            </div>
            <div class="linkname">
              <span>Team</span>
            </div>
          </a>
        </div>

        <div class="navitem">
          <a href="setting.html" class="a">
            <div class="nav">
              <span>
                <img src="/sources/images/gear.svg" alt="" />
              </span>
            </div>
            <div class="linkname">
              <span>Setting</span>
            </div>
          </a>
        </div>

        <div class="navitem" style="position: absolute; bottom: 0; width: 100%">
          <a href="login.html" class="a">
            <div class="nav">
              <span>
                <img src="/sources/images/box-arrow-left.svg" alt="" />
              </span>
            </div>
            <div class="linkname">
              <span>Logout</span>
            </div>
          </a>
        </div>
      </div>

      <div class="topbar">
        <div class="top-left">
          <a href="" class="a">
            <div class="nav1">
              <span>
                <img
                  src="/sources/images/list.svg"
                  alt=""
                  style="width: 30px; height: 30px"
                />
              </span>
            </div>
          </a>
        </div>
        <div class="top-right">
          <div class="t1">
            <a href="" id="sidebarToggle" class="a">
              <div class="nav1">
                <span>
                  <img src="/sources/images/question-circle.svg" alt="" />
                </span>
              </div>
            </a>
          </div>

          <div class="t2">
            <a href="" class="a">
              <div class="nav1">
                <span>
                  <img src="/sources/images/bell.svg" alt="" />
                </span>
              </div>
            </a>
          </div>

          <div class="t3">
            <a href="" class="a">
              <div class="nav1">
                <span>
                  <img src="/sources/images/people.svg" alt="" />
                </span>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="title">
        <span class="heading">Time Tracker</span>
      </div>

      <form action="" method="post">
        <div class="task-bar">
          <div class="add-label">
            <input
              type="text"
              class="label"
              id="label"
              name="task"
              placeholder="Add task to track time"
              oninput="checkForm()"
              required
            />
          </div>

          <div class="add-due">
            <input
              type="text"
              class="label"
              id="time-picker"
              name="dueTime"
              placeholder="Add task due (in hours)"
              oninput="checkForm()"
              required
            />
          </div>

          <div class="add-btn">
            <div class="label">
              <input id="add-button" type="submit" value="Add" disabled />
            </div>
          </div>
        </div>
      </form>

      <div class="filter-bar">
        <div class="filteration">
          <span class="fx1">Filter </span>
          <div class="flex">
            <span class="fx2">Range</span>
          </div>
          <div class="flex">
            <span class="fx3">Status</span>
          </div>
          <div class="flex">
            <span class="fx4">Team</span>
          </div>
          <div class="flex">
            <span class="fx5">
              <input
                id="apply-button"
                class="apply-button"
                type="submit"
                value="Apply"
                disabled
              />
            </span>
          </div>
        </div>
      </div>

      <div class="project-list">
        <div class="head">
          <div class="date">Date</div>
        </div>
        <div class="task-list">
          <!-- <div class="project-name">Name</div> -->
          <table>
            <thead>
              <tr>
                <!-- <th>Task ID</th> -->
                <th>Task Name</th>
                <th>Project</th>
                <th>Due</th>
                <th>%</th>
                <th>00:00:00</th>
                <th>Start</th>
                <th style="text-align: center">
                  <img
                    src="/sources/images/ellipsis.png"
                    alt=""
                    style="width: 3px; height: 12px; margin-left: 0"
                  />
                </th>
              </tr>
            </thead>
            <tbody id="task-table-body"></tbody>
          </table>
        </div>
      </div>
      <div class="dropdown-menu" id="dropdown-menu">
        <div class="delete">
          <a href="#" class="delete a">Delete</a>
        </div>
        <hr />
        <div class="delete">
          <a href="#" class="edit a">Edit</a>
        </div>
        <hr />
        <div class="view-team">
          <a href="#" class="view-team a">View Team</a>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
